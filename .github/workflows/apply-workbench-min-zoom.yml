name: Apply workbench min zoom source fix

on:
  push:
    branches: [fix/workbench-min-zoom-source]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply source fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              'src/react/timeline-rendering.ts',
              'return Math.max((durationMs / 1_000) * pixelsPerSecond, 640);',
              'return Math.max((durationMs / 1_000) * pixelsPerSecond, 1);',
          )
          replace(
              'src/react/timeline-rendering.ts',
              'return (deltaX / Math.max(1, pixelsPerSecond)) * 1_000;',
              'return (deltaX / Math.max(Number.EPSILON, pixelsPerSecond)) * 1_000;',
          )
          replace(
              'src/time.ts',
              'const thresholdMs = (snap.thresholdPx / Math.max(1, pixelsPerSecond)) * 1_000;',
              'const thresholdMs = (snap.thresholdPx / Math.max(Number.EPSILON, pixelsPerSecond)) * 1_000;',
          )
          replace(
              'src/react/timeline-editor/viewport.ts',
              'const pixelsPerSecond = Math.max(1, viewport.pixelsPerSecond);',
              'const pixelsPerSecond = Math.max(Number.EPSILON, viewport.pixelsPerSecond);',
          )
          replace(
              'src/react/timeline-editor/viewport.ts',
              'export function getNextTimelineEditorPixelsPerSecond(pixelsPerSecond: number, direction: number) {\n  return clampTimelineEditorTime(\n    pixelsPerSecond + direction * 16,\n    timelineEditorMinPixelsPerSecond,',
              'export function getNextTimelineEditorPixelsPerSecond(\n  pixelsPerSecond: number,\n  direction: number,\n  minPixelsPerSecond = timelineEditorMinPixelsPerSecond,\n) {\n  return clampTimelineEditorTime(\n    pixelsPerSecond + direction * 16,\n    minPixelsPerSecond,',
          )
          replace(
              'src/react/timeline-editor/viewport.ts',
              'Math.max(1, pixelsPerSecond)',
              'Math.max(Number.EPSILON, pixelsPerSecond)',
          )
          replace(
              'src/react/timeline-editor/interactions.ts',
              'Math.max(1, pixelsPerSecond)',
              'Math.max(Number.EPSILON, pixelsPerSecond)',
          )
          replace(
              'src/react/timeline-editor/types.ts',
              '  tool?: TimelineEditorTool;\n  minItemDurationMs?: number;',
              '  tool?: TimelineEditorTool;\n  minPixelsPerSecond?: number;\n  minItemDurationMs?: number;',
          )
          replace(
              'src/react/timeline-editor/types.ts',
              '  | "hotkeys"\n  | "minItemDurationMs"',
              '  | "hotkeys"\n  | "minPixelsPerSecond"\n  | "minItemDurationMs"',
          )
          replace(
              'src/react/timeline-editor/keyboard.ts',
              '  hotkeys: TimelineEditorHotkeys;\n  nudgeMs: number;',
              '  hotkeys: TimelineEditorHotkeys;\n  minPixelsPerSecond: number;\n  nudgeMs: number;',
          )
          replace(
              'src/react/timeline-editor/keyboard.ts',
              '  hotkeys,\n  nudgeMs,',
              '  hotkeys,\n  minPixelsPerSecond,\n  nudgeMs,',
          )
          replace(
              'src/react/timeline-editor/keyboard.ts',
              'pixelsPerSecond: getNextTimelineEditorPixelsPerSecond(viewport.pixelsPerSecond, direction),',
              'pixelsPerSecond: getNextTimelineEditorPixelsPerSecond(\n          viewport.pixelsPerSecond,\n          direction,\n          minPixelsPerSecond,\n        ),',
          )
          replace(
              'src/react/timeline-editor/provider.tsx',
              'import { defaultTimelineEditorHotkeys, timelineEditorTrackHeaderWidthPx } from "./constants";',
              'import {\n  defaultTimelineEditorHotkeys,\n  timelineEditorMinPixelsPerSecond,\n  timelineEditorTrackHeaderWidthPx,\n} from "./constants";',
          )
          replace(
              'src/react/timeline-editor/provider.tsx',
              '  tool = "select",\n  minItemDurationMs,',
              '  tool = "select",\n  minPixelsPerSecond = timelineEditorMinPixelsPerSecond,\n  minItemDurationMs,',
          )
          replace(
              'src/react/timeline-editor/provider.tsx',
              '    hotkeys: resolvedHotkeys,\n    editPolicy,',
              '    hotkeys: resolvedHotkeys,\n    minPixelsPerSecond,\n    editPolicy,',
          )
          provider = Path('src/react/timeline-editor/provider.tsx')
          provider_text = provider.read_text().replace(
              'Math.max(1, resolvedViewport.pixelsPerSecond)',
              'Math.max(Number.EPSILON, resolvedViewport.pixelsPerSecond)',
          )
          provider.write_text(provider_text)
          replace(
              'src/react/timeline-editor/provider.tsx',
              '        resolvedViewport.pixelsPerSecond,\n        direction,\n      );',
              '        resolvedViewport.pixelsPerSecond,\n        direction,\n        minPixelsPerSecond,\n      );',
          )
          replace(
              'src/react/timeline-editor/provider.tsx',
              '    [durationMs, onViewportChange, resolvedViewport],',
              '    [durationMs, minPixelsPerSecond, onViewportChange, resolvedViewport],',
          )
          replace(
              'src/react/timeline-editor/implementation.tsx',
              '  tool,\n  minItemDurationMs,',
              '  tool,\n  minPixelsPerSecond,\n  minItemDurationMs,',
          )
          replace(
              'src/react/timeline-editor/implementation.tsx',
              '    hotkeys,\n    minItemDurationMs,',
              '    hotkeys,\n    minPixelsPerSecond,\n    minItemDurationMs,',
          )
          replace(
              'src/react/workbench/types.ts',
              '  pixelsPerSecond?: number;\n  viewport?: TimelineEditorViewport;',
              '  pixelsPerSecond?: number;\n  minPixelsPerSecond?: number;\n  viewport?: TimelineEditorViewport;',
          )
          replace(
              'src/react/workbench/toolbar.tsx',
              '  timelineEditorMaxPixelsPerSecond,\n  timelineEditorMinPixelsPerSecond,\n  type TimelineEditorHotkeys,',
              '  timelineEditorMaxPixelsPerSecond,\n  type TimelineEditorHotkeys,',
          )
          replace(
              'src/react/workbench/toolbar.tsx',
              '  pixelsPerSecond: number;\n  readOnly: boolean;',
              '  pixelsPerSecond: number;\n  minPixelsPerSecond: number;\n  readOnly: boolean;',
          )
          replace(
              'src/react/workbench/toolbar.tsx',
              '  pixelsPerSecond,\n  readOnly,',
              '  pixelsPerSecond,\n  minPixelsPerSecond,\n  readOnly,',
          )
          replace(
              'src/react/workbench/toolbar.tsx',
              '          min={timelineEditorMinPixelsPerSecond}',
              '          min={minPixelsPerSecond}',
          )
          replace(
              'src/react/workbench/canvas.tsx',
              '  tool?: TimelineEditorTool;\n  minItemDurationMs?: number;',
              '  tool?: TimelineEditorTool;\n  minPixelsPerSecond: number;\n  minItemDurationMs?: number;',
          )
          replace(
              'src/react/workbench/canvas.tsx',
              '  tool,\n  minItemDurationMs,',
              '  tool,\n  minPixelsPerSecond,\n  minItemDurationMs,',
          )
          replace(
              'src/react/workbench/canvas.tsx',
              'Math.max(1, resolvedViewport.pixelsPerSecond)',
              'Math.max(Number.EPSILON, resolvedViewport.pixelsPerSecond)',
          )
          replace(
              'src/react/workbench/canvas.tsx',
              '          tool={tool}\n          minItemDurationMs={minItemDurationMs}',
              '          tool={tool}\n          minPixelsPerSecond={minPixelsPerSecond}\n          minItemDurationMs={minItemDurationMs}',
          )
          replace(
              'src/react/workbench/implementation.tsx',
              'import { isKeyboardEventFromEditableTarget, matchesHotkey } from "../timeline-editor/hotkeys";',
              'import { isKeyboardEventFromEditableTarget, matchesHotkey } from "../timeline-editor/hotkeys";\nimport { timelineEditorMinPixelsPerSecond } from "../timeline-editor/constants";',
          )
          replace(
              'src/react/workbench/implementation.tsx',
              '  pixelsPerSecond = 80,\n  viewport,',
              '  pixelsPerSecond = 80,\n  minPixelsPerSecond = timelineEditorMinPixelsPerSecond,\n  viewport,',
          )
          replace(
              'src/react/workbench/implementation.tsx',
              '      pixelsPerSecond={pixelsPerSecond}\n      readOnly={readOnly}',
              '      pixelsPerSecond={pixelsPerSecond}\n      minPixelsPerSecond={minPixelsPerSecond}\n      readOnly={readOnly}',
          )
          replace(
              'src/react/workbench/implementation.tsx',
              '        tool={resolvedTool}\n        minItemDurationMs={minItemDurationMs}',
              '        tool={resolvedTool}\n        minPixelsPerSecond={minPixelsPerSecond}\n        minItemDurationMs={minItemDurationMs}',
          )

          test = Path('src/react/timeline-editor/viewport.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\n\nimport { getNextTimelineEditorPixelsPerSecond } from "./viewport";\n\ndescribe("timeline editor viewport", () => {\n  it("honors a consumer minimum below the default zoom floor", () => {\n    expect(getNextTimelineEditorPixelsPerSecond(8, -1, 0.25)).toBe(0.25);\n    expect(getNextTimelineEditorPixelsPerSecond(0.5, -1, 0.25)).toBe(0.25);\n  });\n});\n''')
          PY
      - name: Format changed sources
        run: bun run format
      - name: Typecheck source contract
        run: bun run check-types
      - name: Run focused viewport test
        run: bunx vitest run --config vitest.config.ts src/react/timeline-editor/viewport.test.ts
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Move workbench minimum zoom support into source"
          git push origin HEAD:fix/workbench-min-zoom-source
