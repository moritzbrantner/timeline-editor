name: Format resize slice

on:
  push:
    branches:
      - feat/atomic-multi-item-resize-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format changed files
        run: bun run format src/operations/multi-item-resize.ts src/operations/multi-item-resize.test.ts tests/package/export-contract.json
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/operations/multi-item-resize.ts src/operations/multi-item-resize.test.ts tests/package/export-contract.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/operations/multi-item-resize.ts src/operations/multi-item-resize.test.ts tests/package/export-contract.json
          git commit -m "Format atomic multi-item resize slice"
          git push
