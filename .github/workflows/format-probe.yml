name: Clipboard Format Probe

on:
  push:
    branches:
      - feat/atomic-track-aware-clipboard

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format clipboard test
        run: bun run format src/operations/clipboard.test.ts
      - name: Show formatter diff
        run: git diff -- src/operations/clipboard.test.ts
