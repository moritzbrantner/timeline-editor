name: Format Probe

on:
  push:
    branches:
      - fix/atomic-multi-item-moves

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format changed TypeScript
        run: bun run format src/operations/multi-item-move.ts src/operations/multi-item-move.test.ts
      - name: Show formatter diff
        run: git diff -- src/operations/multi-item-move.ts src/operations/multi-item-move.test.ts
