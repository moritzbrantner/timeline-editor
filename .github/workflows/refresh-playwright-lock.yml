name: Refresh Playwright lockfile

on:
  push:
    branches:
      - fix/playwright-ci-baseline

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/playwright-ci-baseline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refresh lockfile
        run: bun install
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix: refresh Bun lockfile"
          git push origin HEAD:fix/playwright-ci-baseline
