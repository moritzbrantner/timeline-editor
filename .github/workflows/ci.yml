name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      unit_test_command: |
        bun run test:unit
        bun run test:packages
        bun run test:rust
      cache_cargo: true
      timeout_minutes: 25

  integration-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      pre_command: rustup target add wasm32-unknown-unknown
      integration_command: bun run test:integration
      package_check_command: |
        bun run build:packages
        bun run build:wasm
        bun run check-examples
        node ./tests/package/export-contract.mjs
        node ./tests/package/smoke.mjs
      cache_cargo: true
      timeout_minutes: 45

  storybook-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      storybook_build_command: bun run build-storybook
      storybook_test_command: bun run test:storybook
      install_playwright: true
      timeout_minutes: 35

  e2e-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      e2e_command: bun run test:playwright
      install_playwright: true
      artifact_retention_days: 7
      timeout_minutes: 45

  performance-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: bun install --frozen-lockfile
      pre_command: bunx playwright install --with-deps chromium
      unlighthouse_command: bun run test:lighthouse
      artifact_paths: |
        .unlighthouse
        test-results
      artifact_retention_days: 7
      timeout_minutes: 45
