name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: latest
      install_command: bun install --frozen-lockfile
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: |
        bun run test:unit
        bun run test:packages
        bun run test:rust
      cache_cargo: true
      timeout_minutes: 25

  integration-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: latest
      install_command: bun install --frozen-lockfile
      pre_command: |
        rustup target add wasm32-unknown-unknown
        bunx playwright install --with-deps chromium
      integration_command: bun run test:integration
      package_check_command: |
        bun run build:packages
        bun run build:wasm
        bun run check-examples
        node ./tests/package/export-contract.mjs
        node ./tests/package/smoke.mjs
        bun run verify:git-install
      cache_cargo: true
      timeout_minutes: 45

  storybook-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: latest
      install_command: bun install --frozen-lockfile
      storybook_build_command: bun run build-storybook
      storybook_test_command: bun run test:storybook
      install_playwright: true
      timeout_minutes: 35

  e2e-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: latest
      install_command: bun install --frozen-lockfile
      e2e_command: bun run test:playwright
      install_playwright: true
      artifact_retention_days: 7
      timeout_minutes: 45

  dependency-resolution:
    outputs:
      allow-skipped: ${{ steps.merge-scope.outputs.allow-skipped }}
      validate-source-validation: ${{ steps.merge-scope.outputs.validate-source-validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Determine required PR validation scope
        id: merge-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          filters = {'validate-source-validation': {'paths': None, 'branches': None}}
          def matches(path, pattern):
              pattern = re.escape(pattern).replace(r"\*\*", ".*").replace(r"\*", "[^/]*").replace(r"\?", "[^/]")
              return re.fullmatch(pattern, path) is not None
          skipped = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, scope in filters.items():
                  matches_paths = scope["paths"] is None or any(matches(path, pattern) for path in paths if path for pattern in scope["paths"])
                  matches_branch = scope["branches"] is None or any(matches(os.environ["BASE_BRANCH"], pattern) for pattern in scope["branches"])
                  required = matches_paths and matches_branch
                  print(f"{name}={str(required).lower()}", file=output)
                  if not required:
                      skipped.append(name)
              print("allow-skipped=" + json.dumps(skipped), file=output)
          PYTHON
      - name: Check out coding-tooling source dependency runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: moritzbrantner/coding-tooling
          ref: c67d5b11de0576f96d484db5ac8060cc1655a007
          path: .source/coding-tooling
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Verify clean consumer dependency resolution
        run: |
          bun install --frozen-lockfile
          bun run registry:restore
          bun run build:packages
          bun run test:dependency-resolution

  performance-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    with:
      bun_version: latest
      install_command: bun install --frozen-lockfile
      pre_command: bunx playwright install --with-deps chromium
      unlighthouse_command: bun run test:lighthouse
      artifact_paths: |
        .unlighthouse
        test-results
      artifact_retention_days: 7
      timeout_minutes: 45

  validate-source-validation:
    needs: dependency-resolution
    if: github.event_name == 'pull_request' && needs.dependency-resolution.outputs.validate-source-validation == 'true'
    uses: ./.github/workflows/source-validation.yml
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      [
        "fast-validation",
        "integration-validation",
        "storybook-validation",
        "e2e-validation",
        "dependency-resolution",
        "performance-validation",
        "validate-source-validation",
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["fast-validation", "integration-validation", "storybook-validation", "e2e-validation", "dependency-resolution", "performance-validation", "validate-source-validation"]'
          allow-skipped: ${{ needs.dependency-resolution.outputs.allow-skipped || '[]' }}
