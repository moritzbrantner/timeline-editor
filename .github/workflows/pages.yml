name: Editor Playground Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@41d30fd97f0b58c148f135112ceb9124e976d7bc
    with:
      bun_version: "1.4.4"
      node_version: "24"
      build_command: "bun run build:pages"
      artifact_path: dist-pages
      concurrency_group: timeline-editor-pages
