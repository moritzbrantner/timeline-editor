name: Editor Core source migration

on:
  push:
    branches:
      - fix/moenarch-source-first

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    env:
      EDITOR_CORE_SOURCE: ${{ github.workspace }}/.source/editor-core
    steps:
      - name: Check out timeline-editor
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out editor-core source
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/editor-core
          path: .source/editor-core

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply package-scope migration
        run: node scripts/migrate-editor-core-scope.mjs

      - name: Resolve release fallback lockfile
        run: bun install

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Format migration result
        run: bun run format

      - name: Verify against editor-core source
        run: bun run verify:source

      - name: Persist migrated source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/migrate-editor-core-scope.yml scripts/migrate-editor-core-scope.mjs
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "refactor: consume moenarch editor-core source identity"
            git push
          fi
