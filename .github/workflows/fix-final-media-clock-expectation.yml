name: Fix final media clock expectation

on:
  push:
    branches:
      - fix/playwright-ci-baseline
    paths:
      - .github/workflows/fix-final-media-clock-expectation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/playwright-ci-baseline
      - name: Update explicit seek expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/react/workbench.test.tsx")
          text = path.read_text()
          old = '''    rendered.rerender(
                <TimelineWorkbench
                  document={{ ...document, currentTimeMs: 1_300 }}
                  transportState={{ status: "playing", playbackRate: 1, loop: false }}
                  extensions={[createTimelineAudioExtension()]}
                />,
              );
              await act(async () => {
                await Promise.resolve();
              });
              expect(media.play).toHaveBeenCalledTimes(1);
              expect(player.currentTime).toBe(1);
          '''
          new = '''    rendered.rerender(
                <TimelineWorkbench
                  document={{ ...document, currentTimeMs: 1_300 }}
                  transportState={{ status: "playing", playbackRate: 1, loop: false }}
                  extensions={[createTimelineAudioExtension()]}
                />,
              );
              await act(async () => {
                await Promise.resolve();
              });
              expect(media.play).toHaveBeenCalledTimes(1);
              expect(player.currentTime).toBe(1.3);
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one explicit-seek block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/react/workbench.test.tsx
          git commit -m "Align media clock test with explicit seek contract"
          git push origin HEAD:fix/playwright-ci-baseline
