name: Refresh export contract

on:
  push:
    branches:
      - feat/atomic-multi-item-resize-v2

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Refresh export contract
        run: UPDATE_EXPORT_CONTRACT=1 node ./tests/package/export-contract.mjs
      - name: Commit export contract
        run: |
          if git diff --quiet -- tests/package/export-contract.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/package/export-contract.json
          git commit -m "Update multi-item resize export contract"
          git push
