name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show oxfmt diff
        shell: bash
        run: |
          bun run format
          git diff -- src/react/workbench/use-synchronized-media.ts
          git diff --quiet -- src/react/workbench/use-synchronized-media.ts
