name: Apply multi-resize command patch

on:
  push:
    branches:
      - feat/command-multi-item-resize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Patch command and regression coverage
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const commandsPath = 'src/commands.ts';
          let commands = fs.readFileSync(commandsPath, 'utf8');
          commands = commands.replace(
            '  resizeTimelineEditorItem,\n',
            '  resizeTimelineEditorItem,\n  resizeTimelineEditorItems,\n',
          );
          commands = commands.replace(
            '  | { type: "resize-item"; itemId: string; edge: "start" | "end"; timeMs: number }\n',
            '  | { type: "resize-item"; itemId: string; edge: "start" | "end"; timeMs: number }\n  | { type: "resize-items"; itemIds: string[]; edge: "start" | "end"; deltaMs: number }\n',
          );
          const resizeItemHandler = '  if (command.type === "resize-item") {';
          if (!commands.includes(resizeItemHandler)) {
            throw new Error('resize-item handler anchor not found');
          }
          commands = commands.replace(
            resizeItemHandler,
            `  if (command.type === "resize-items") {\n    const tracks = resizeTimelineEditorItems(\n      document.tracks,\n      getTimelineEditorGroupedItemIds(document, command.itemIds),\n      command.edge,\n      command.deltaMs,\n      options,\n    );\n    return result(document, tracks, selection, \`Resize \${command.itemIds.length} items\`);\n  }\n\n${resizeItemHandler}`,
          );
          fs.writeFileSync(commandsPath, commands);

          const testPath = 'src/core.test.tsx';
          let test = fs.readFileSync(testPath, 'utf8');
          const movedAssertion = `    expect(moved.document.tracks[0]?.items[0]?.startMs).toBe(1_500);\n`;
          if (!test.includes(movedAssertion)) {
            throw new Error('command test anchor not found');
          }
          test = test.replace(
            movedAssertion,
            `${movedAssertion}\n    const resizedWithHistory = applyTimelineEditorCommandWithHistory(\n      document,\n      { itemIds: ["brief", "draft"] },\n      createTimelineEditorHistory(),\n      {\n        type: "resize-items",\n        itemIds: ["brief", "draft"],\n        edge: "end",\n        deltaMs: 250,\n      },\n      { durationMs: 8_000 },\n    );\n    expect(resizedWithHistory.label).toBe("Resize 2 items");\n    expect(resizedWithHistory.document.tracks[0]?.items.map((item) => item.durationMs)).toEqual([\n      1_250, 1_250,\n    ]);\n    expect(resizedWithHistory.history.undoStack).toHaveLength(1);\n    expect(\n      undoTimelineEditorHistory(resizedWithHistory.history).document?.tracks[0]?.items.map(\n        (item) => item.durationMs,\n      ),\n    ).toEqual([1_000, 1_000]);\n`,
          );
          fs.writeFileSync(testPath, test);
          NODE
      - run: bun run format src/commands.ts src/core.test.tsx
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands.ts src/core.test.tsx
          git commit -m "Wire atomic multi-resize into commands"
          git push
