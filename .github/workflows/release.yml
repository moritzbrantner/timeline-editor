name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check out coding-tooling source dependency runtime
        uses: actions/checkout@v6.0.2
        with:
          repository: moritzbrantner/coding-tooling
          ref: c67d5b11de0576f96d484db5ac8060cc1655a007
          path: .source/coding-tooling
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Verify
        run: bun run verify

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
