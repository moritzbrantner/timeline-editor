[workspace]
members = [
  "crates/timeline_compute",
  "crates/timeline_audio",
  "crates/timeline_video",
  "crates/timeline_image",
  "crates/timeline_captions",
  "crates/timeline_geo",
  "crates/timeline_data",
  "crates/timeline_tauri_plugin",
]
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
timeline_compute = { path = "crates/timeline_compute" }
